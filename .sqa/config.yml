      github.com/cessda/cessda.cmv.benchmark-runner checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.claret_joyful_chimpanzee.sh
        container: qc.sty_harlequin_impulsive_cobra
      github.com/cessda/cessda.cmv.benchmark-runner hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.snow_tactful_badger.sh
        container: qc.sty_pink_focused_catfish
      github.com/cessda/cessda.cmv.benchmark-runner jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.fog_nervous_vulture.sh
        container: qc.sty_boysenberry_confused_crane
